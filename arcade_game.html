<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Arcade Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            padding: 10px;
            overflow: hidden;
        }
        .console-container {
            background: linear-gradient(135deg, #3a3d40 0%, #181a1b 100%);
            border: 6px solid #111;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2);
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .screen-bezel {
            background-color: #000;
            border-radius: 12px;
            padding: 10px;
            border: 4px solid #222;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        canvas {
            background-color: #050b14;
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            border-radius: 4px;
            image-rendering: pixelated;
        }
        .controls-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px 5px 10px;
        }
        /* D-PAD Style */
        .dpad {
            position: relative;
            width: 120px;
            height: 120px;
        }
        .dpad-btn {
            position: absolute;
            background: linear-gradient(to bottom, #2d2d2d, #1a1a1a);
            border: 2px solid #111;
            box-shadow: 0 4px 0 #000;
            cursor: pointer;
            active: scale(0.95);
        }
        .dpad-btn:active {
            background: #111;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #000;
        }
        .dpad-left {
            top: 40px;
            left: 0;
            width: 45px;
            height: 40px;
            border-radius: 6px 0 0 6px;
        }
        .dpad-right {
            top: 40px;
            right: 0;
            width: 45px;
            height: 40px;
            border-radius: 0 6px 6px 0;
        }
        .dpad-center {
            top: 40px;
            left: 45px;
            width: 30px;
            height: 40px;
            background: #1a1a1a;
            border: none;
            box-shadow: none;
            pointer-events: none;
        }
        .dpad-up-dummy {
            top: 0;
            left: 40px;
            width: 40px;
            height: 40px;
            background: #252525;
            border-radius: 6px 6px 0 0;
            border: 2px solid #111;
            opacity: 0.4;
        }
        .dpad-down-dummy {
            bottom: 0;
            left: 40px;
            width: 40px;
            height: 40px;
            background: #252525;
            border-radius: 0 0 6px 6px;
            border: 2px solid #111;
            opacity: 0.4;
        }
        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            transform: rotate(-15deg);
        }
        .action-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #111;
            color: white;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: -2px 4px 0 #000;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .btn-a {
            background: linear-gradient(135deg, #ff3366 0%, #990033 100%);
        }
        .btn-b {
            background: linear-gradient(135deg, #ffcc00 0%, #996600 100%);
        }
        .action-btn:active {
            transform: translate(-1px, 2px);
            box-shadow: -1px 2px 0 #000;
            filter: brightness(0.9);
        }
        .branding {
            margin-top: 15px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="console-container">
        <div class="screen-bezel">
            <canvas id="gameCanvas" width="400" height="300"></canvas>
        </div>
        
        <div class="controls-panel">
            <!-- Left Side: D-Pad -->
            <div class="dpad">
                <div class="dpad-up-dummy"></div>
                <button class="dpad-btn dpad-left" id="btnLeft">◀</button>
                <div class="dpad-center"></div>
                <button class="dpad-btn dpad-right" id="btnRight">▶</button>
                <div class="dpad-down-dummy"></div>
            </div>
            
            <!-- Right Side: Retro Action Buttons -->
            <div class="action-buttons">
                <button class="action-btn btn-b" id="btnB">B</button>
                <button class="action-btn btn-a" id="btnA">A</button>
            </div>
        </div>
        
        <div class="branding">Arcade System</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Configuration
        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 40,
            width: 30,
            height: 30,
            speed: 6,
            color: '#00ffcc',
            movingLeft: false,
            movingRight: false
        };

        let obstacles = [];
        let score = 0;
        let gameOver = false;
        let gameSpeed = 3;
        let spawnRate = 0.02; // Initial chance to spawn obstacle per frame

        // Hooking up Console Buttons
        const leftBtn = document.getElementById('btnLeft');
        const rightBtn = document.getElementById('btnRight');
        const btnA = document.getElementById('btnA');
        const btnB = document.getElementById('btnB');

        // Touch/Mouse Controls for moving left
        const startLeft = (e) => { e.preventDefault(); player.movingLeft = true; };
        const endLeft = (e) => { e.preventDefault(); player.movingLeft = false; };
        leftBtn.addEventListener('mousedown', startLeft);
        leftBtn.addEventListener('mouseup', endLeft);
        leftBtn.addEventListener('touchstart', startLeft);
        leftBtn.addEventListener('touchend', endLeft);

        // Touch/Mouse Controls for moving right
        const startRight = (e) => { e.preventDefault(); player.movingRight = true; };
        const endRight = (e) => { e.preventDefault(); player.movingRight = false; };
        rightBtn.addEventListener('mousedown', startRight);
        rightBtn.addEventListener('mouseup', endRight);
        rightBtn.addEventListener('touchstart', startRight);
        rightBtn.addEventListener('touchend', endRight);

        // Action buttons reset game if over
        const actionPress = (e) => {
            e.preventDefault();
            if (gameOver) {
                resetGame();
            }
        };
        btnA.addEventListener('mousedown', actionPress);
        btnA.addEventListener('touchstart', actionPress);
        btnB.addEventListener('mousedown', actionPress);
        btnB.addEventListener('touchstart', actionPress);

        // Standard Keyboard fallback fallback
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') player.movingLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') player.movingRight = true;
            if (gameOver && (e.key === ' ' || e.key === 'Enter')) resetGame();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') player.movingLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') player.movingRight = false;
        });

        function spawnObstacle() {
            if (Math.random() < spawnRate) {
                const size = Math.floor(Math.random() * 20) + 15;
                const x = Math.random() * (canvas.width - size);
                obstacles.push({
                    x: x,
                    y: -size,
                    width: size,
                    height: size,
                    color: '#ff3366',
                    speed: gameSpeed + Math.random() * 2
                });
            }
        }

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 3;
            spawnRate = 0.02;
            player.x = canvas.width / 2 - 15;
            gameOver = false;
            update();
        }

        function update() {
            if (gameOver) return;

            // Move Player
            if (player.movingLeft && player.x > 0) {
                player.x -= player.speed;
            }
            if (player.movingRight && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Spawn and Move Obstacles
            spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                // Collision detection
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    gameOver = true;
                }

                // Remove out of bounds obstacles & reward score
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    
                    // Scale difficulty
                    if (score % 100 === 0) {
                        gameSpeed += 0.5;
                        spawnRate += 0.005;
                    }
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = '#050b14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Subtle Grid/Matrix Background lines for classic vibe
            ctx.strokeStyle = '#0d1b2a';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=20) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let j=0; j<canvas.height; j+=20) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            // Draw Player Ship / Block
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Engine glow
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x + player.width/4, player.y + player.height - 4, player.width/2, 4);

            // Draw Obstacles
            for (let obs of obstacles) {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            // Draw HUD Score
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillText(`SCORE: ${score}`, 15, 30);

            // Draw Game Over Screen
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff3366';
                ctx.font = 'bold 28px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px "Courier New", monospace';
                ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('PRESS ANY CONSOLE BUTTON TO RESTART', canvas.width / 2, canvas.height / 2 + 45);
                ctx.textAlign = 'left'; // reset orientation
            }
        }

        // Initialize Game Loop
        resetGame();
    </script>
</body>
</html>
